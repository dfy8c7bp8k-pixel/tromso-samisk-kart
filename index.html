<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <title>Samiske stedsnavn – Tromsø</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #map {
      height: 100vh;
      width: 100vw;
    }

    .popup-samisk {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 2px 0;
    }

    .popup-norsk {
      font-size: 13px;
      margin: 0;
      opacity: 0.85;
    }

    /* Språkblokker */
    .popup-lang {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      align-items: flex-start;
    }

    .lang-icon {
      width: 22px;
      height: auto;
      margin-top: 2px;
      flex: 0 0 auto;
    }

    .popup-text {
      font-size: 14px;
      line-height: 1.4;
    }

    .popup-text p {
      margin: 0 0 6px 0;
    }

    .popup-text a {
      text-decoration: none;
      color: #0066cc;
    }

    .popup-text a:hover {
      text-decoration: underline;
    }

    .popup-article-button {
      border: 0;
      border-radius: 4px;
      background: #075d67;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      margin-top: 2px;
      padding: 8px 12px;
    }

    .popup-article-button:hover,
    .popup-article-button:focus-visible {
      background: #064a52;
    }

    #lang-switcher {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: white;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    #lang-switcher button {
      border: none;
      background: none;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: 600;
    }

    #lang-switcher button.active {
      background: #eee;
    }

    .lang-switcher a {
      display: inline-block;
      padding: 6px 10px;
      text-decoration: none;
      color: #111;
      background: #fff;
      border-right: 1px solid #ddd;
      font-weight: 700;
    }

    .lang-switcher a:last-child {
      border-right: none;
    }

    .lang-switcher a.active {
      background: #eee;
    }
    .custom-svg-marker {
      background: transparent;
      border: none;
    }

    .marker-shell {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }

    .marker-inner {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform-origin: center center;
      will-change: transform;
      transition: none;
    }

    .article-dialog {
      background: #fff;
      border: 0;
      box-shadow: -8px 0 28px rgba(0, 0, 0, 0.24);
      color: #172326;
      height: 100dvh;
      margin: 0 0 0 auto;
      max-height: none;
      max-width: 560px;
      padding: 0;
      width: min(560px, 100vw);
    }

    .article-dialog::backdrop,
    .video-dialog::backdrop {
      background: rgba(13, 27, 31, 0.34);
    }

    .article-panel__header {
      background: #f2f7f6;
      border-bottom: 1px solid #d8e2df;
      padding: 24px 64px 20px 28px;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .article-panel__kicker {
      color: #075d67;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.06em;
      margin: 0 0 8px;
      text-transform: uppercase;
    }

    .article-panel__title {
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.14;
      margin: 0;
    }

    .article-panel__close {
      align-items: center;
      background: #fff;
      border: 1px solid #bccbc7;
      border-radius: 999px;
      color: #172326;
      cursor: pointer;
      display: flex;
      font-size: 26px;
      height: 40px;
      justify-content: center;
      line-height: 1;
      position: absolute;
      right: 18px;
      top: 18px;
      width: 40px;
    }

    .article-panel__notice {
      background: #fff7d6;
      border-left: 4px solid #d49a00;
      font-size: 14px;
      line-height: 1.45;
      margin: 24px 28px 0;
      padding: 10px 12px;
    }

    .article-panel__body {
      font-size: 16px;
      line-height: 1.68;
      padding: 24px 28px 48px;
    }

    .article-panel__lead {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.55;
      margin: 0 0 26px;
    }

    .article-panel__figure {
      margin: 0 0 26px;
    }

    .article-panel__image {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
    }

    .article-panel__body h2 {
      font-size: 21px;
      line-height: 1.3;
      margin: 32px 0 10px;
    }

    .article-panel__body p {
      margin: 0 0 18px;
    }

    .article-panel__body blockquote {
      border-left: 4px solid #075d67;
      color: #30474c;
      font-size: 19px;
      margin: 4px 0 28px;
      padding: 2px 0 2px 18px;
    }

    .article-panel__body blockquote p {
      white-space: pre-line;
    }

    .article-panel__body cite {
      display: block;
      font-size: 14px;
      font-style: normal;
      margin-top: 10px;
    }

    .article-panel__sources {
      border-top: 1px solid #d8e2df;
      margin-top: 34px;
      padding-top: 20px;
    }

    .article-panel__sources a {
      color: #075d67;
      overflow-wrap: anywhere;
    }

    .article-video-link {
      background: none;
      border: 0;
      color: #075d67;
      cursor: pointer;
      font: inherit;
      padding: 0;
      text-align: left;
      text-decoration: underline;
    }

    .article-video-card {
      background: #f2f7f6;
      border: 1px solid #bccbc7;
      border-radius: 8px;
      display: block;
      overflow: hidden;
      width: 100%;
    }

    .article-video-card__preview {
      aspect-ratio: 4 / 3;
      display: block;
      position: relative;
    }

    .article-video-card__preview img {
      display: block;
      height: 100%;
      object-fit: cover;
      width: 100%;
    }

    .article-video-card__play {
      align-items: center;
      background: rgba(13, 27, 31, 0.85);
      border: 2px solid #fff;
      border-radius: 50%;
      color: #fff;
      display: flex;
      font-size: 30px;
      height: 64px;
      justify-content: center;
      left: 50%;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 64px;
    }

    .article-video-card__label {
      display: block;
      padding: 14px 16px;
    }

    .article-video-card:focus-visible {
      outline: 3px solid #075d67;
      outline-offset: 3px;
    }

    .video-dialog {
      background: #fff;
      border: 0;
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.24);
      color: #172326;
      max-height: calc(100dvh - 32px);
      padding: 0;
      width: min(520px, calc(100vw - 32px));
    }

    .video-dialog__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .video-dialog__actions button,
    .video-dialog__actions a {
      background: #f2f7f6;
      border: 1px solid #bccbc7;
      border-radius: 6px;
      color: #075d67;
      cursor: pointer;
      font: inherit;
      padding: 10px 16px;
    }

    @media (max-width: 600px) {
      .article-panel__header {
        padding: 20px 58px 16px 20px;
      }

      .article-panel__notice {
        margin: 18px 20px 0;
      }

      .article-panel__body {
        padding: 20px 20px 40px;
      }

      .article-panel__close {
        right: 12px;
        top: 12px;
      }
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <dialog id="article-dialog" class="article-dialog" aria-labelledby="article-title">
    <article>
      <header class="article-panel__header">
        <p id="article-kicker" class="article-panel__kicker"></p>
        <h1 id="article-title" class="article-panel__title"></h1>
        <button
          id="article-close"
          class="article-panel__close"
          type="button"
          aria-label="Lukk"
        >×</button>
      </header>
      <p id="article-notice" class="article-panel__notice" hidden></p>
      <div id="article-body" class="article-panel__body"></div>
    </article>
  </dialog>

  <dialog id="video-dialog" class="video-dialog" lang="no" aria-labelledby="video-title" aria-describedby="video-description">
    <header class="article-panel__header">
      <h2 id="video-title" class="article-panel__title">Du forlater nå kartet</h2>
      <button id="video-close" class="article-panel__close" type="button" aria-label="Lukk">×</button>
    </header>
    <div class="article-panel__body">
      <p id="video-description">Denne videoen leveres av YouTube. Kartprosjektet har ikke ansvar for innhold eller tjenester levert av eksterne aktører.</p>
      <div class="video-dialog__actions">
        <button id="video-cancel" type="button" autofocus>Avbryt</button>
        <a id="video-continue" target="_blank" rel="noopener noreferrer">Fortsett til YouTube</a>
      </div>
    </div>
  </dialog>

  <!-- App -->
  <script src="./app.js"></script>
</body>
</html>
